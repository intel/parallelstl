name: oneDPL CI Testing

on:
  push:
    branches: [main]
  # PRs are tested on demand: see ci-on-demand.yml, which dispatches this workflow with the inputs below.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to report the result to as a commit status (optional)'
        required: false
        type: string
        default: ''
      sha:
        description: 'Commit SHA to test; required with pr_number (defaults to the dispatch ref)'
        required: false
        type: string
        default: ''
      base_sha:
        description: 'PR base commit SHA; enables the clang-format check of the changed lines (optional)'
        required: false
        type: string
        default: ''

run-name: ${{ inputs.pr_number != '' && format('oneDPL CI Testing for PR #{0} ({1})', inputs.pr_number, inputs.sha) || '' }}

permissions: read-all

env:
  BUILD_CONCURRENCY: 4
  MACOS_BUILD_CONCURRENCY: 3
  TEST_TIMEOUT: 360
  WINDOWS_TBB_DOWNLOAD_LINK: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e45876b2-24fc-48cb-9d42-a1431747dd03/intel-onetbb-2023.0.0.718_offline.exe
  WINDOWS_ICPX_DOWNLOAD_LINK: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/baec913e-84a0-439d-becc-6fb62f2d0c83/intel-dpcpp-cpp-compiler-2026.0.0.560_offline.exe
  WINDOWS_ONEAPI_PATH: C:\Program Files (x86)\Intel\oneAPI
  LINUX_ONEAPI_PATH: /opt/intel/oneapi
  VS2022_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || github.ref }}
  # Only a newer on-demand run for the same PR supersedes an in-progress one.
  cancel-in-progress: ${{ inputs.pr_number != '' }}

jobs:
  # Reports a pending commit status on the tested PR commit so the run shows up in the PR checks.
  report-start:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          SHA: ${{ inputs.sha }}
        with:
          script: |
            const sha = process.env.SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`A full commit SHA is required with pr_number, got '${sha}'.`);
              return;
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state: 'pending', context: 'oneDPL CI Testing (on demand)',
              description: 'Running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  clang-format:
    if: github.event_name == 'workflow_dispatch' && inputs.base_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Get clang-format
        run: sudo apt-get install -yqq clang-format
      - name: Applying clang-format for changed files
        env:
          HEAD_SHA: ${{ inputs.sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid SHA inputs"; exit 1; }
          .github/scripts/clang-format-diff.sh "$HEAD_SHA" "$BASE_SHA"
      - name: Creating diff
        run: git diff > clang-format.diff
      - name: Checking if diff is empty
        run: if [ -s clang-format.diff ]; then cat clang-format.diff; exit 1; fi
      - if: failure()
        name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clang-format-diff
          path: clang-format.diff
          retention-days: 3

  linux-testing:
    name: ${{ matrix.device_type }},bknd=${{ matrix.backend }},cmplr=${{ matrix.cxx_compiler }},${{ matrix.os }},std=c++${{ matrix.std }},cfg=${{ matrix.build_type }}
    runs-on: ['${{ matrix.os }}']
    timeout-minutes: 60
    # Long-running jobs share six repository-wide job-level concurrency groups,
    # onedpl-ci-slot-1 through onedpl-ci-slot-6.
    concurrency:
      group: onedpl-ci-slot-${{ matrix.ci_slot }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ci_slot: 1
            cxx_compiler: icpx
            std: 17
            build_type: release
            backend: dpcpp
            device_type: cpu
          - os: ubuntu-latest
            ci_slot: 2
            cxx_compiler: icpx
            std: 17
            build_type: release
            backend: tbb
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 2
            cxx_compiler: icpx
            std: 17
            build_type: release
            backend: omp
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 4
            cxx_compiler: g++
            std: 17
            build_type: release
            backend: omp
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 5
            cxx_compiler: g++
            std: 17
            build_type: release
            backend: tbb
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 1
            cxx_compiler: clang++
            std: 17
            build_type: release
            backend: tbb
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 1
            cxx_compiler: clang++
            std: 17
            build_type: release
            backend: omp
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 2
            cxx_compiler: g++
            std: 17
            build_type: release
            backend: serial
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 3
            cxx_compiler: icpx
            std: 20
            build_type: RelWithAsserts
            backend: dpcpp
            device_type: cpu
          - os: ubuntu-latest
            ci_slot: 4
            cxx_compiler: icpx
            std: 20
            build_type: RelWithAsserts
            backend: tbb
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 6
            cxx_compiler: icpx
            std: 20
            build_type: RelWithAsserts
            backend: omp
            device_type: HOST
          - os: ubuntu-latest
            ci_slot: 5
            cxx_compiler: g++
            std: 20
            build_type: RelWithAsserts
            backend: serial
            device_type: HOST
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Intel® oneAPI
        uses: ./.github/actions/setup-linux-oneapi
        with:
          tbb: ${{ matrix.backend == 'tbb' || matrix.backend == 'dpcpp' }}
          compiler: ${{ matrix.cxx_compiler == 'icpx' }}
      - name: Install OpenMP dependencies
        if: (matrix.os == 'ubuntu-latest' && matrix.cxx_compiler == 'clang++' && matrix.backend == 'omp')
        run: |
          sudo apt-get install libomp5 libomp-dev -y
      - name: Run testing
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          DEVICE_TYPE: ${{ matrix.device_type }}
          STD: ${{ matrix.std }}
          BUILD_TYPE: ${{ matrix.build_type }}
          CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: .github/scripts/run-linux-tests.sh

  windows-testing:
    name: ${{ matrix.device_type }},bknd=${{ matrix.backend }},cmplr=${{ matrix.cxx_compiler }},${{ matrix.os }},std=c++${{ matrix.std }},cfg=${{ matrix.build_type }}
    runs-on: ['${{ matrix.os }}']
    timeout-minutes: 60
    concurrency:
      group: onedpl-ci-slot-${{ matrix.ci_slot }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ci_slot: 1
            cxx_compiler: icx-cl
            std: 17
            build_type: release
            backend: tbb
            device_type: HOST
          - os: windows-latest
            ci_slot: 2
            cxx_compiler: cl
            std: 17
            build_type: release
            backend: tbb
            device_type: HOST
          - os: windows-latest
            ci_slot: 3
            cxx_compiler: icx
            std: 17
            build_type: release
            backend: dpcpp
            device_type: cpu
          - os: windows-latest
            ci_slot: 4
            cxx_compiler: cl
            std: 20
            build_type: RelWithAsserts
            backend: serial
            device_type: HOST
          - os: windows-latest
            ci_slot: 5
            cxx_compiler: icx-cl
            std: 20
            build_type: RelWithAsserts
            backend: tbb
            device_type: HOST
          - os: windows-latest
            ci_slot: 6
            cxx_compiler: icx
            std: 20
            build_type: RelWithAsserts
            backend: dpcpp
            device_type: cpu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Intel® oneAPI
        uses: ./.github/actions/setup-windows-oneapi
        with:
          tbb: ${{ matrix.backend == 'tbb' || matrix.backend == 'dpcpp' }}
          compiler: ${{ matrix.cxx_compiler == 'icx-cl' || matrix.cxx_compiler == 'icx' }}
      - name: Run testing
        shell: cmd
        env:
          BACKEND: ${{ matrix.backend }}
          DEVICE_TYPE: ${{ matrix.device_type }}
          STD: ${{ matrix.std }}
          BUILD_TYPE: ${{ matrix.build_type }}
          CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: |
          call .github\scripts\run-windows-tests.cmd
          exit /b %errorlevel%

  linux-examples-testing:
    name: examples,cmplr=icpx,ubuntu-latest,std=c++17,cfg=release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: onedpl-ci-slot-2
      queue: max
      cancel-in-progress: false
    env:
      CXX_COMPILER: icpx
      STD: 17
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Intel® oneAPI
        uses: ./.github/actions/setup-linux-oneapi
        with:
          tbb: true
          compiler: true
      - name: Build and run examples
        shell: bash
        run: .github/scripts/build-run-examples.sh

  windows-examples-testing:
    name: examples,cmplr=icx,windows-latest,std=c++17,cfg=release
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: onedpl-ci-slot-3
      queue: max
      cancel-in-progress: false
    env:
      CXX_COMPILER: icx
      STD: 17
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Intel® oneAPI
        uses: ./.github/actions/setup-windows-oneapi
        with:
          tbb: true
          compiler: true
      - name: Build and run examples
        shell: cmd
        run: |
          call .github\scripts\build-run-examples.cmd
          exit /b %errorlevel%

  macos-testing:
    name: HOST,bknd=${{ matrix.backend }},cmplr=${{ matrix.cxx_compiler }},${{ matrix.os }},std=c++${{ matrix.std }},cfg=${{ matrix.build_type }}
    runs-on: ['${{ matrix.os }}']
    timeout-minutes: 60
    concurrency:
      group: onedpl-ci-slot-${{ matrix.ci_slot }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ci_slot: 4
            cxx_compiler: clang++
            std: 17
            build_type: release
            backend: omp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Install OpenMP for Clang++
        run: |
          brew install libomp
      - name: Run testing
        shell: bash
        run: |
          set -x
          sysctl -a | grep machdep.cpu
          # workaround for CMake not being able to find OpenMP: see https://discourse.cmake.org/t/how-to-find-openmp-with-clang-on-macos/8860
          # -DCMAKE_POLICY_DEFAULT_CMP0074=NEW below is forced to make sure CMake uses <PackageName>_ROOT variables.
          export OpenMP_ROOT=$(brew --prefix)/opt/libomp
          mkdir build && cd build

          # TODO: fix or justify the excluded warnings
          warning_flags="-Wall -Werror -Wno-error=sign-compare -Wno-error=pass-failed"

          cmake -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} -DONEDPL_BACKEND=${{ matrix.backend }} -DCMAKE_POLICY_DEFAULT_CMP0074=NEW -DCMAKE_CXX_FLAGS="${warning_flags}" ..
          make VERBOSE=1 build-onedpl-tests -j${MACOS_BUILD_CONCURRENCY} 2>&1 | tee build.log
          ctest --timeout ${TEST_TIMEOUT} --output-on-failure -E "${EXCLUDE_FROM_TESTING}" 2>&1 | tee ctest.log

          python ${GITHUB_WORKSPACE}/.github/scripts/job_summary.py --build-log build.log --ctest-log ctest.log \
                                                                   --output-file summary.md --compiler ${{ matrix.cxx_compiler }}

  # Reports the final result of an on-demand run to the tested PR commit.
  report-result:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    needs: [report-start, clang-format, linux-testing, windows-testing, linux-examples-testing, windows-examples-testing, macos-testing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          SHA: ${{ inputs.sha }}
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const sha = process.env.SHA;
            if (!/^[0-9a-f]{40}$/.test(sha))
              return;
            const STATUS_CONTEXT = 'oneDPL CI Testing (on demand)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Do not overwrite the status if a newer run (or request) for this commit has taken it over,
            // e.g. when this run was cancelled because the button was clicked again.
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ ...context.repo, ref: sha, per_page: 100 });
            const latest = statuses.find(st => st.context === STATUS_CONTEXT);
            if (latest && latest.target_url !== runUrl) {
              core.notice(`Status is owned by ${latest.target_url}; not overwriting.`);
              return;
            }

            const needs = JSON.parse(process.env.NEEDS);
            // clang-format only runs when a base SHA was provided; a skip there is not an error.
            if (needs['clang-format']?.result === 'skipped')
              delete needs['clang-format'];
            const results = Object.values(needs).map(n => n.result);
            let state = 'success', description = 'All jobs passed';
            if (results.includes('failure')) {
              state = 'failure'; description = 'Some jobs failed';
            } else if (results.some(r => r !== 'success')) {
              state = 'error'; description = 'Run was cancelled or jobs were skipped';
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state, context: STATUS_CONTEXT, description, target_url: runUrl,
            });
